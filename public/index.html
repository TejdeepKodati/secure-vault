<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#11141a">
<meta name="robots" content="noindex, nofollow">
<title>Secure Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f8ef7' d='M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>

<!-- Icon sprite. Inline SVG is markup, not script, so it needs no CSP exception. -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5.5v5.9c0 5 3.4 9.6 8 10.6 4.6-1 8-5.6 8-10.6V5.5z"/><path d="m8.6 11.8 2.4 2.4 4.4-4.6" class="tick"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5" class="fold"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6" class="fold"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5" class="fold"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M9 17v-5h1.6a1.4 1.4 0 0 1 0 2.8H9m4.4 2.2v-5h1.4a1.6 1.6 0 0 1 0 5z" class="fold"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M9 12h6M9 15h6M9 18h4" class="fold"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17V6l9-2v11"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="15.5" cy="15.5" r="2.5"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 12 6-3.5v7z"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v4m0 2v2m0 2v3" class="fold"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6m0 0-6 6m6-6 6 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v3"/><path d="M13 18h8m0 0-3-3m3 3-3 3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5" /><circle cx="12" cy="7.8" r="1.1" class="solid"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.6" class="solid"/><circle cx="12" cy="12" r="1.6" class="solid"/><circle cx="12" cy="18.5" r="1.6" class="solid"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 18V8m0 0 4 4m-4-4-4 4M5 5h14"/></symbol>
  <symbol id="i-folder-up" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 17v-5m0 0-2.5 2.5M12 12l2.5 2.5" class="fold"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><path d="m11 11 9 9m-3 0 3-3m-6-3 2.5 2.5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="M14 12h7m0 0-3-3m3 3-3 3"/></symbol>
</svg>

<div id="boot" class="boot"><span class="spinner"></span></div>

<!-- ============================ LOGIN (SRS 4) ============================ -->
<main id="login-view" class="login is-hidden">
  <form id="login-form" class="card" novalidate>
    <div class="brand brand-lg">
      <svg class="ico ico-brand" aria-hidden="true"><use href="#i-shield"></use></svg>
      <div>
        <h1>Secure Vault</h1>
        <p class="brand-sub">Your private file store</p>
      </div>
    </div>

    <label class="field">
      <span class="field-label">PIN</span>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password"
             placeholder="Enter your PIN" required autofocus spellcheck="false">
    </label>

    <button id="login-submit" class="btn btn-primary btn-block" type="submit">Unlock</button>
    <p id="login-error" class="alert is-hidden" role="alert"></p>
    <p class="hint">Files are stored on your own server. Nothing is sent anywhere else.</p>
  </form>
</main>

<!-- ============================ APP SHELL ============================ -->
<div id="app-view" class="app is-hidden">

  <header class="topbar">
    <div class="brand">
      <svg class="ico ico-brand" aria-hidden="true"><use href="#i-shield"></use></svg>
      <span class="brand-name">Secure Vault</span>
    </div>

    <div class="search">
      <svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="search" type="search" placeholder="Search this folder" autocomplete="off"
             aria-label="Filter items in this folder by name">
      <button id="search-clear" class="icon-btn is-hidden" type="button" aria-label="Clear search">
        <svg class="ico" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="topbar-end">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">
        <svg class="ico ico-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
        <svg class="ico ico-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
      </button>
      <div class="menu-wrap">
        <button id="menu-btn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false"
                aria-label="Account menu">
          <svg class="ico" aria-hidden="true"><use href="#i-dots"></use></svg>
        </button>
        <div id="menu" class="menu is-hidden" role="menu">
          <button class="menu-item" type="button" role="menuitem" data-action="trash">
            <svg class="ico" aria-hidden="true"><use href="#i-trash"></use></svg> Recycle Bin
          </button>
          <button class="menu-item" type="button" role="menuitem" data-action="change-pin">
            <svg class="ico" aria-hidden="true"><use href="#i-key"></use></svg> Change PIN
          </button>
          <div class="menu-sep"></div>
          <button class="menu-item" type="button" role="menuitem" data-action="logout">
            <svg class="ico" aria-hidden="true"><use href="#i-logout"></use></svg> Log out
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="pin-nudge" class="banner is-hidden">
    <span>You are still using the PIN this vault was created with.</span>
    <button class="btn btn-ghost btn-sm" type="button" data-action="change-pin">Change it</button>
  </div>

  <!-- Toolbar: navigation (SRS 10), uploads (SRS 7), refresh (SRS 19) -->
  <div class="toolbar">
    <button id="back-btn" class="icon-btn" type="button" aria-label="Back to parent folder" disabled>
      <svg class="ico" aria-hidden="true"><use href="#i-back"></use></svg>
    </button>
    <nav id="breadcrumb" class="crumbs" aria-label="Current location"></nav>

    <div class="toolbar-end">
      <button id="upload-files-btn" class="btn" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-upload"></use></svg>
        <span class="btn-text">Upload</span>
      </button>
      <button id="upload-folder-btn" class="btn" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-folder-up"></use></svg>
        <span class="btn-text">Folder</span>
      </button>
      <button id="new-folder-btn" class="btn" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>
        <span class="btn-text">New folder</span>
      </button>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh this folder">
        <svg class="ico" aria-hidden="true"><use href="#i-refresh"></use></svg>
      </button>
    </div>
  </div>

  <!-- Selection actions (SRS 17). Single-item-only actions are hidden unless one row is selected. -->
  <div id="selbar" class="selbar is-hidden" role="region" aria-label="Selection actions">
    <label class="check">
      <input id="select-all" type="checkbox" aria-label="Select all items">
    </label>
    <span id="sel-count" class="sel-count"></span>
    <div class="selbar-actions">
      <button class="btn btn-sm single-only" type="button" data-action="open">
        <svg class="ico" aria-hidden="true"><use href="#i-eye"></use></svg><span class="btn-text">Open</span>
      </button>
      <button class="btn btn-sm single-only" type="button" data-action="rename">
        <svg class="ico" aria-hidden="true"><use href="#i-pencil"></use></svg><span class="btn-text">Rename</span>
      </button>
      <button class="btn btn-sm" type="button" data-action="move">
        <svg class="ico" aria-hidden="true"><use href="#i-move"></use></svg><span class="btn-text">Move</span>
      </button>
      <button class="btn btn-sm single-only" type="button" data-action="info">
        <svg class="ico" aria-hidden="true"><use href="#i-info"></use></svg><span class="btn-text">Info</span>
      </button>
      <button class="btn btn-sm single-only file-only" type="button" data-action="download">
        <svg class="ico" aria-hidden="true"><use href="#i-download"></use></svg><span class="btn-text">Download</span>
      </button>
      <button class="btn btn-sm btn-danger" type="button" data-action="delete">
        <svg class="ico" aria-hidden="true"><use href="#i-trash"></use></svg><span class="btn-text">Delete</span>
      </button>
      <button id="sel-clear" class="btn btn-sm btn-ghost" type="button">Clear</button>
    </div>
  </div>

  <!-- File browser (SRS 9) -->
  <main id="dropzone" class="content">
    <div class="table" role="table" aria-label="Files and folders">
      <div class="thead" role="row">
        <span class="col-check" role="columnheader"></span>
        <span class="col-name" role="columnheader">Name</span>
        <span class="col-type" role="columnheader">Type</span>
        <span class="col-size" role="columnheader">Size</span>
        <span class="col-date" role="columnheader">Modified</span>
        <span class="col-actions" role="columnheader">Actions</span>
      </div>
      <div id="rows" class="tbody" role="rowgroup"></div>
    </div>

    <div id="listing-empty" class="empty is-hidden"></div>
    <div id="listing-busy" class="listing-busy is-hidden"><span class="spinner"></span></div>
    <div id="drop-hint" class="drop-hint is-hidden" aria-hidden="true">
      <svg class="ico" aria-hidden="true"><use href="#i-upload"></use></svg>
      <p>Drop files or folders to upload</p>
    </div>
  </main>

  <footer id="statusbar" class="statusbar"></footer>
</div>

<!-- Upload progress (SRS 8) -->
<section id="upload-panel" class="upload-panel is-hidden" aria-label="Upload progress">
  <div class="upload-head">
    <strong id="upload-title">Uploading</strong>
    <button id="upload-close" class="icon-btn icon-btn-sm" type="button" aria-label="Hide upload progress">
      <svg class="ico" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="bar"><div id="upload-bar" class="bar-fill"></div></div>
  <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
  <ul id="upload-list" class="upload-list"></ul>
  <div class="upload-foot">
    <button id="upload-cancel" class="btn btn-sm btn-ghost" type="button">Cancel remaining</button>
  </div>
</section>

<!-- Context menu (SRS 22); also opened by the per-row button so touch devices get the same actions. -->
<div id="ctx" class="ctx is-hidden" role="menu" aria-label="Item actions"></div>

<div id="modal-root" class="modal-root is-hidden"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<input id="file-input" class="sr-only" type="file" multiple tabindex="-1" aria-hidden="true">
<input id="folder-input" class="sr-only" type="file" multiple webkitdirectory directory tabindex="-1" aria-hidden="true">
</body>
</html>
